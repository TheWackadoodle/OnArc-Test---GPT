plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'app.daywell.planner'
    compileSdk 35
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig { applicationId 'app.daywell.planner'; minSdk 28; targetSdk 35; versionCode 1; versionName '1.0.0' }
    flavorDimensions 'device'
    productFlavors {
        phone { dimension 'device' }
        watch { dimension 'device'; versionCode 2 }
    }
    if (System.getenv('DAYWELL_KEYSTORE')) {
        signingConfigs { upload {
            storeFile file(System.getenv('DAYWELL_KEYSTORE'))
            storePassword System.getenv('DAYWELL_STORE_PASSWORD')
            keyAlias 'daywell'
            keyPassword System.getenv('DAYWELL_STORE_PASSWORD')
        } }
        buildTypes.release.signingConfig signingConfigs.upload
    }
}
flutter { source '../..' }
dependencies {
    watchImplementation 'androidx.wear.tiles:tiles:1.4.1'
    watchImplementation 'com.google.guava:guava:33.3.1-android'
    watchImplementation 'com.google.android.support:wearable:2.9.0'
    watchCompileOnly 'com.google.android.wearable:wearable:2.9.0'
}
