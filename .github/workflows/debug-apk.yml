name: Debug APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.x
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Point Gradle at the SDKs
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10.2
      - run: flutter pub get
      - run: flutter test
      - name: Build phone APK
        run: flutter build apk --debug --flavor phone
      - name: Build watch APK
        run: flutter build apk --debug --flavor watch
      - uses: actions/upload-artifact@v4
        with:
          name: daywell-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
